<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1"name=viewport><title>Gridville</title><style>:root{--bg:#3e4659;--panel:#495d66;--text:#e7e8e3;--accent:#4a95e6;--dim:#a4d0dd}body,html{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow:hidden}#frame{position:fixed;inset:0;line-height:0}canvas.emscripten{display:block;width:100vw;height:100vh;border:0;outline:0;background:#000}#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);line-height:normal}#overlay.hidden{display:none}#spinner{width:42px;height:42px;border:4px solid var(--panel);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}#overlay.error #spinner{display:none}@keyframes spin{to{transform:rotate(360deg)}}#status{font-size:15px;letter-spacing:.04em;color:var(--dim)}#overlay.error #status{color:#f89c89}#bar{position:fixed;top:6px;left:50%;transform:translateX(-50%);display:flex;gap:6px;opacity:.25;transition:opacity .2s;z-index:2}#bar:hover{opacity:1}#bar button{background:var(--panel);color:var(--text);border:0;border-radius:4px;padding:4px 10px;font:12px system-ui,sans-serif;cursor:pointer;text-decoration:none}#bar button:hover{background:var(--accent)}</style></head><body><div id=frame><canvas class=emscripten id=canvas oncontextmenu=event.preventDefault() tabindex=-1></canvas><div id=overlay><div id=spinner></div><div id=status>Loading Gridville...</div></div></div><div id=bar><button onclick=Module.requestFullscreen(!1,!1) title=Fullscreen>Fullscreen</button></div><script>const overlay=document.getElementById("overlay"),statusEl=document.getElementById("status");function showError(e){overlay.classList.remove("hidden"),overlay.classList.add("error"),statusEl.textContent=e}var Module={canvas:(()=>{const e=document.getElementById("canvas");return e.addEventListener("mousedown",(()=>e.focus())),e.addEventListener("webglcontextlost",(e=>{showError("WebGL context lost. Please reload the page."),e.preventDefault()}),!1),e})(),print:(...e)=>console.log(...e),printErr:(...e)=>console.error(...e),setStatus:e=>{if(!e)return overlay.classList.add("hidden"),void Module.canvas.focus();statusEl.textContent=e.replace(/\(([\d.]+)\/([\d.]+)\)/,((e,t,o)=>"("+Math.round(100*t/o)+"%)"))},totalDependencies:0,monitorRunDependencies:e=>{Module.totalDependencies=Math.max(Module.totalDependencies,e),Module.setStatus(e?"Preparing... ("+(Module.totalDependencies-e)+"/"+Module.totalDependencies+")":"")},onAbort:e=>showError("Gridville stopped: "+e)};Module.setStatus("Downloading Gridville..."),window.onerror=()=>showError("Something went wrong, see the browser console for details.")</script><script async src=gridville.js></script></body></html>
